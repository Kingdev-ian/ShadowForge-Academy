      }, [src]);

      // Unmute on any real interaction. Browsers reject audible playback
      // while the page has no user activation: the promise is swallowed and
      // the next gesture retries, so audio is never lost for good.
      const tryUnmute = useCallback(() => {
        const node = videoRef.current;
        if (!node || !allowAudio) return;
        if (!videoHasAudioTrack(node)) return;
        if (!node.muted) {
          setUnmuted(true);
          return;
        }
        node.muted = false;
        node.volume = 1;
        const attempt = node.play();
        if (attempt && typeof attempt.catch === "function") {
          attempt.catch(() => { node.muted = true; setUnmuted(false); });
        }
        setUnmuted(!node.muted);
      }, [allowAudio]);

      // Capture phase: the very click that opened the modal counts as the
      // gesture, and the listener is not torn down by re-renders.
      useEffect(() => {
        if (!allowAudio) return undefined;
        const onGesture = () => tryUnmute();
        const events = ["pointerdown", "click", "keydown", "touchend"];
        events.forEach((name) => window.addEventListener(name, onGesture, { capture: true }));
        return () => {
          events.forEach((name) => window.removeEventListener(name, onGesture, { capture: true }));
        };
      }, [allowAudio, tryUnmute]);

      // Parent flipped "Ambient Acoustics" to MUTED mid-stream.
      useEffect(() => {
        const node = videoRef.current;
        if (!node) return;
        if (!allowAudio) {
          node.muted = true;
          setUnmuted(false);
        } else {
          tryUnmute();
        }
      }, [allowAudio, tryUnmute]);

      const toggleAudio = (event) => {
        event.stopPropagation();
        const node = videoRef.current;
        if (!node || !allowAudio) return;
        if (!node.muted) {
          node.muted = true;
          setUnmuted(false);
        } else {
          tryUnmute();
        }
        if (typeof audio.playClick === "function") audio.playClick();
      };

      const togglePlayback = () => {
        const node = videoRef.current;
        if (!node) return;
        if (node.paused || node.ended) {
          const attempt = node.play();
          if (attempt && typeof attempt.catch === "function") attempt.catch(() => { });
        } else {
          node.pause();
        }
        tryUnmute();
        if (typeof audio.playClick === "function") audio.playClick();
      };

      return (
        <div className="relative flex-1 w-full h-full bg-black overflow-hidden">
          <style>{FORGE_PLAYER_KEYFRAMES}</style>

          {/* There is no scrub bar by design — /!\ the volume UI and nofullscreen
              must NOT sit in controlsList: Chrome's "nodownload" check hides
              the audio track, and nofullscreen hides the Picture-in-Picture
              button (→ per-user persistent muting). Controls are never shown
              anyway, so the list is dropped entirely. */}
          <video
            ref={videoRef}
            src={src}
            autoPlay
            muted
            playsInline
            preload="auto"
            disablePictureInPicture
            onContextMenu={(e) => e.preventDefault()}
            onClick={togglePlayback}
            onPlay={() => { setPlaying(true); setEnded(false); }}
            onPause={() => setPlaying(false)}
            onPlaying={() => { setBuffering(false); tryUnmute(); }}
            onCanPlay={() => { setBuffering(false); tryUnmute(); }}
            onLoadedMetadata={() => {
              // Only ever *confirm* an audio track here — never deny one.
              const node = videoRef.current;
              if (node && typeof node.webkitAudioDecodedByteCount === "number" &&
                node.webkitAudioDecodedByteCount > 0) {
                videoAudioHint = "yes";
              }
              tryUnmute();
            }}
            onWaiting={() => setBuffering(true)}
            onVolumeChange={() => setUnmuted(!(videoRef.current && videoRef.current.muted))}
            onEnded={() => {
              setPlaying(false);
              setEnded(true);
              setBuffering(false);
              if (onEnded) onEnded();
            }}
            className="w-full h-full object-contain md:max-w-[420px] mx-auto cursor-pointer select-none"
            style={{ background: "#000" }}
          />

          {/* Buffering -> Lighting the Forge (never a circular spinner) */}
          {buffering && !ended && <ForgeLoader />}

          {/* Click-to-play affordance. pointer-events-none so the video keeps
              receiving the click target across the whole frame. */}
          {!playing && !buffering && !ended && (
            <div
              className="pointer-events-none absolute inset-0 z-10 flex flex-col items-center justify-center"
              style={{ animation: "forgePauseFade 260ms ease-out both" }}
            >
              <div className="w-11 h-11 rounded-full border border-[#FFC857]/60 bg-[#07090E]/60 backdrop-blur-sm flex items-center justify-center">
                <div
                  className="w-0 h-0 ml-[3px]"
                  style={{
                    borderTop: "6px solid transparent",
                    borderBottom: "6px solid transparent",
                    borderLeft: "9px solid #FFC857"
                  }}
                />
              </div>
              <div className="mono mt-3 text-[7px] tracking-[0.3em] text-[#E8E6E1]/45">
                TAP TO PLAY
              </div>
            </div>
          )}

          {/* Audio state. The nudge only claims "unmute" when the stream is
              actually known to carry sound; otherwise it simply invites a tap
              (which is what a browser needs before any audio is allowed). */}
          {allowAudio && (unmuted ? (
            <div
              key="audio-on"
              className="pointer-events-none absolute top-4 left-4 z-20 mono text-[7px] tracking-[0.26em] text-[#FFC857]/80"
              style={{ animation: "forgeHudFade 2600ms ease-out both" }}
            >
              AUDIO RESONANT
            </div>
          ) : (
            <div className="pointer-events-none absolute bottom-4 left-1/2 -translate-x-1/2 z-20 border border-[#FFC857]/50 bg-black/70 px-3 py-1 backdrop-blur-sm mono text-[7px] tracking-[0.22em] text-[#FFC857]">
              {videoAudioHint === "no" ? "NO AUDIO TRACK" : "TAP TO UNMUTE"}
            </div>
          ))}

          {/* AUDIO [ON] / [MUTED] — manual override beside SKIP [×] */}
          {allowAudio && (
            <button
              type="button"
              onClick={toggleAudio}
              aria-pressed={unmuted}
              aria-label={unmuted ? "Mute audio" : "Unmute audio"}
              className="absolute top-4 right-[92px] z-30 mono text-[8.5px] tracking-[0.2em] border border-[#E8E6E1]/40 px-2.5 py-1 text-[#E8E6E1] bg-black/70 backdrop-blur-sm hover:text-[#FFC857] hover:border-[#FFC857]/70 transition-colors"
            >
              {unmuted ? "AUDIO [ON]" : "AUDIO [MUTED]"}
            </button>
          )}

          {/* SKIP [×] — clean top-right anchor, always reachable */}
          <button
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              if (onSkip) onSkip();
            }}
            className="absolute top-4 right-4 z-30 mono text-[8.5px] tracking-[0.2em] border border-[#E8E6E1]/40 px-2.5 py-1 text-[#E8E6E1] bg-black/70 backdrop-blur-sm hover:text-[#FFC857] hover:border-[#FFC857]/70 transition-colors"
          >
            SKIP [×]
          </button>
        </div>
      );
    }

    /* =======================================================================
       THE LIVING SKYBRIDGE — layered canvas over the obsidian void
       =======================================================================
       Three stacked layers, each owning one transform channel so nothing
       fights another:

         L1  deep wireframe grid receding to the vanishing point (never shakes)
         L2  structural deck + truss: SHIVERS when tensile shear exceeds 0.70 kN
         L3  instrument plane: fracture hole, ticks, overlays (always crisp)

       Living scenery (upward particles + rotating glass debris) drifts above.
       Palette: obsidian #07090E · limestone #E8E6E1 · cyan #00E5FF · gold #FFC857
       ======================================================================= */

    /* Deterministic PRNG so the debris field is stable across re-renders. */
    function mfSeededRandom(seed) {
      let state = (seed * 9301 + 49297) % 233280 || 1;
      return function () {
        state = (state * 9301 + 49297) % 233280;
        return state / 233280;
      };
    }

    /* Vanishing point of the perspective grid (percentage of the canvas). */
    const MF_VANISHING_POINT = { x: 50, y: 58 };

    /* L1 — A deep 3D wireframe receding into the centre void: rails converge
       on the vanishing point, transverse wires are perspective-spaced, and the
       core of the ellipse is swallowed by pure obsidian so the grid reads as
       depth rather than a flat backdrop. */
    function MFPerspectiveGrid() {
      const vx = MF_VANISHING_POINT.x * 10;
      const vy = MF_VANISHING_POINT.y * 5.6;

      // Rails fan out from the void; the two central rails are the load axis.
      const rails = [-260, -170, -100, -46, -16, 16, 46, 100, 170, 260];

      // Each ring is scaled toward the vanishing point -> artificial perspective.
      const rings = [0.06, 0.13, 0.22, 0.33, 0.47, 0.64, 0.84, 1.08, 1.38];

      return (
        <svg
          viewBox="0 0 1000 560"
          preserveAspectRatio="xMidYMid slice"
          className="absolute inset-0 h-full w-full"
          aria-hidden="true"
          style={{ animation: "mf-grid-recede 11s ease-in-out infinite" }}
        >
          <defs>
            <linearGradient id="mf-grid-fade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#E8E6E1" stopOpacity="0" />
              <stop offset="30%" stopColor="#E8E6E1" stopOpacity="0.5" />
              <stop offset="100%" stopColor="#E8E6E1" stopOpacity="0.95" />
            </linearGradient>
            <radialGradient id="mf-void-core">
              <stop offset="0%" stopColor="#07090E" stopOpacity="1" />
              <stop offset="55%" stopColor="#07090E" stopOpacity="0.68" />
              <stop offset="100%" stopColor="#07090E" stopOpacity="0" />
            </radialGradient>
          </defs>

          {rails.map((offset, i) => (
            <line
              key={`rail-${i}`}
              x1={vx}
              y1={vy}
              x2={vx + offset * 6.4}
              y2="600"
              stroke="url(#mf-grid-fade)"
              strokeWidth={i === 4 || i === 5 ? 1 : 0.7}
              strokeOpacity={i === 4 || i === 5 ? 0.32 : 0.16}
            />
          ))}

          {rings.map((scale, i) => {
            const rx = 150 * scale + 8;
            const ry = 52 * scale + 3;
            return (
              <ellipse
                key={`ring-${i}`}
                cx={vx}
                cy={vy}
                rx={rx}
                ry={ry}
                fill="none"
                stroke="#E8E6E1"
                strokeWidth="0.7"
                strokeOpacity={0.05 + i * 0.035}
              />
            );
          })}

          {/* The void swallows the core of the grid so it reads as depth. */}
          <ellipse cx={vx} cy={vy} rx="230" ry="120" fill="url(#mf-void-core)" />
        </svg>
      );
    }

    /* SHR-2 — continuous upward-drifting micro-particles. They rise against
       the terminal-velocity freefall wind; each is depth-scaled for parallax. */
    function buildMFParticles(seed, count) {
      const rand = mfSeededRandom(seed + 7);
      const total = count || 34;
      return Array.from({ length: total }, (_, i) => {
        const depth = i % 3; // 0 = far, 2 = near
        return {
          key: `mf-particle-${seed}-${i}`,
          x: rand() * 100,
          y: 30 + rand() * 80,
          size: depth === 2 ? 2.2 : depth === 1 ? 1.5 : 1,
          cyan: rand() > 0.62,
          depth,
          dur: 9 + rand() * 16,
          delay: -rand() * 20
        };
      });
    }

    function MFParticleField({ seed }) {
      const particles = useMemo(() => buildMFParticles(seed), [seed]);
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          {particles.map((p) => (
            <span
              key={p.key}
              className="absolute mf-anim rounded-full"
              style={{
                left: `${p.x}%`,
                top: `${p.y}%`,
                width: p.size,
                height: p.size,
                background: p.cyan ? "#00E5FF" : "#E8E6E1",
                opacity: 0.1 + p.depth * 0.14,
                animation: `mf-particle-rise ${p.dur}s linear ${p.delay}s infinite`,
                willChange: "transform, opacity"
              }}
            />
          ))}
        </div>
      );
    }

    /* SHR-1 — living glass debris: slow, asynchronous float, tilt and spin so
       the shards read as floating glass in a zero-g slipstream. */
    function buildMFShards(seed) {
      const rand = mfSeededRandom(seed);
      return Array.from({ length: 20 }, (_, i) => {
        const depth = i % 3; // 0 = far, 2 = near -> drives parallax, blur, opacity
        const size = 9 + rand() * (depth === 2 ? 52 : 26);
        return {
          key: `mf-shard-${seed}-${i}`,
          x: rand() * 100,
          y: 4 + rand() * 84,
          size,
          rotation: rand() * 360,
          depth,
          floatDur: 15 + rand() * 16,
          floatDelay: -rand() * 14,
          spinDur: 42 + rand() * 46,
          spinDelay: -rand() * 30,
          tiltDur: 7 + rand() * 9,
          tiltDelay: -rand() * 8,
          float: depth % 2 === 0 ? "mf-shard-float-a" : "mf-shard-float-b",
          hot: depth === 2 && rand() > 0.66
        };
      });
    }

    function MFShardField({ seed }) {
      const shards = useMemo(() => buildMFShards(seed), [seed]);
      return (

          {shards.map((s) => (

    /* GATE 02 · the interactive cyan cutting line. Armed only once the root is
       named. The apprentice must physically drag the beam from one side of the
       singularity hole to the other; releasing short of the far edge snaps it
       back and counts as a strike. There is no button that does this for them. */
    function MFCutLine({ armed, severed, onSever, onMiss, progress }) {
      const trackRef = useRef(null);
      const draggingRef = useRef(false);
      const [x, setX] = useState(16);

      const MID = 50;          // the singularity sits at the track centre
      const COMMIT = MID + 30; // beam must pass the far edge of the hole

      const ratioFromEvent = (event) => {
        const node = trackRef.current;
        if (!node) return null;
        const box = node.getBoundingClientRect();
        const clientX =
          event.touches && event.touches[0] ? event.touches[0].clientX : event.clientX;
        if (typeof clientX !== "number") return null;
        return Math.min(100, Math.max(0, ((clientX - box.left) / box.width) * 100));
      };

      const reset = () => {
        draggingRef.current = false;
        progress.current = 0;
        setX(16);
      };

      const handleDown = (event) => {
        if (!armed || severed) return;
        draggingRef.current = true;
        progress.current = 0;
        const ratio = ratioFromEvent(event);
        if (ratio !== null) setX(ratio);
      };

      const handleMove = (event) => {
        if (!draggingRef.current || severed) return;
        const ratio = ratioFromEvent(event);
        if (ratio === null) return;
        setX(ratio);
        progress.current = Math.max(progress.current, ratio - MID);
        // A full pass beyond the far edge of the hole commits the sever.
        if (ratio >= COMMIT) {
          reset();
          onSever();
        }
      };

      const handleUp = () => {
        if (!draggingRef.current) return;
        const travelled = progress.current;
        reset();
        // Dragged, but never reached the far side: the deck holds.
        if (travelled > 4) onMiss();
      };

      const beamVisible = armed || severed;

      return (
        <div className="w-full">
          <div className="flex items-center justify-between mb-2">
            <span className="mono text-[7px] tracking-[0.26em] text-[#00E5FF]/70">
              GATE 02 // MONOMOLECULAR CUTTING LINE
            </span>
            <span className="mono text-[7px] tracking-[0.22em] text-[#E8E6E1]/30">
              {severed ? "SEVER COMMITTED" : armed ? "ARMED" : "LOCKED — NAME THE ROOT"}
            </span>
          </div>

          <div
            ref={trackRef}
            onMouseDown={handleDown}
            onMouseMove={handleMove}
            onMouseUp={handleUp}
            onMouseLeave={handleUp}
            onTouchStart={handleDown}
            onTouchMove={handleMove}
            onTouchEnd={handleUp}
            className="relative h-24 w-full border border-[#E8E6E1]/15 bg-[#07090E] overflow-hidden"
            style={{ cursor: armed && !severed ? "crosshair" : "not-allowed" }}
          >
            {/* The singularity hole the beam must cross */}
            <div
              className="absolute top-1/2 -translate-y-1/2 rounded-full border"
              style={{
                left: `${MID}%`,
                width: "17%",
                aspectRatio: "1 / 1",
                transform: "translate(-50%, -50%)",
                borderColor: severed ? "#FFC857" : "rgba(255,200,87,0.55)",
                background: "#07090E",
                boxShadow: severed
                  ? "0 0 18px rgba(255,200,87,0.7)"
                  : "0 0 12px rgba(255,200,87,0.35)",
                animation: severed ? "none" : "mf-hole-breathe 2.6s ease-in-out infinite"
              }}
            />

            {/* Guidance ghost beam */}
            {beamVisible && !severed && (
              <div
                className="absolute top-0 bottom-0 w-px"
                style={{
                  left: `${MID}%`,
                  background: "rgba(0,229,255,0.35)",
                  animation: "mf-cut-ghost 2.2s ease-in-out infinite"
                }}
              />
            )}

            {/* The cyan cutting beam */}
            {beamVisible && (
              <div
                className="absolute top-0 bottom-0"
                style={{
                  left: `${x}%`,
                  width: 2,
                  transform: "translateX(-1px)",
                  background: "#00E5FF",
                  boxShadow: "0 0 14px rgba(0,229,255,0.95), 0 0 4px #00E5FF",
                  animation: severed ? "none" : "mf-cut-armed 1.4s ease-in-out infinite"
                }}
              />
            )}

            {/* Boundary ticks */}
            {[0, 1, 2, 3, 4].map((n) => (
              <div
                key={`cut-tick-${n}`}
                className="absolute bottom-0 w-px bg-[#E8E6E1]/20"
                style={{ left: `${n * 25}%`, height: 6 }}

            ))}
          </div>

          <div className="mono mt-1.5 text-[6.5px] tracking-[0.16em] text-[#E8E6E1]/30">
            {severed
              ? "ROOT TERMINATED — DECK SIMPLIFIED"
              : "DRAG FROM LEFT EDGE, THROUGH THE HOLE, PAST THE FAR EDGE"}
          </div>
        </div>
      );
    }

    /* FAULT 02 · GATE 01 — THE RADICAL CONJUGATE LASER.
       Polynomial factoring does nothing to a radical, so the apprentice must
       physically charge the conjugate beam. Press and hold the core: the beam
       drives itself across the expression. Only a completed charge multiplies
       numerator and denominator by (√(x + b) + c) and forces the difference of
       squares. Releasing mid-charge destabilises the span. There is no shortcut
       button — the deck is operated, not tapped. */
    function MFConjugateBeam({ seed, armed, applied, onApply, onMiss, progress }) {
      const trackRef = useRef(null);
      const draggingRef = useRef(false);
      const holdTimer = useRef(null);
      const [x, setX] = useState(14);

      const MID = 50;
      const COMMIT = MID + 30;

      const handleDown = (event) => {
        if (!armed || applied) return;
        if (event && event.preventDefault) event.preventDefault();
        if (draggingRef.current) return;
        draggingRef.current = true;
        progress.current = 0;
        setX(14);

        let pos = 14;
        if (holdTimer.current) clearInterval(holdTimer.current);
        holdTimer.current = setInterval(() => {
          pos = Math.min(COMMIT, pos + 3);
          progress.current = pos - MID;
          setX(pos);
          if (pos >= COMMIT) {
            if (holdTimer.current) clearInterval(holdTimer.current);
            holdTimer.current = null;
            draggingRef.current = false;
            progress.current = 0;
            pos = 14;
            setX(14);
            onApply();
          }
        }, 55);
      };

      const handleMove = () => {
        // Steering is locked during the charge: the beam only travels forward.
      };

      const handleUp = () => {
        if (!draggingRef.current) return;
        const travelled = progress.current;
        if (holdTimer.current) clearInterval(holdTimer.current);
        holdTimer.current = null;
        draggingRef.current = false;
        progress.current = 0;
        setX(14);
        if (travelled > 4) onMiss();
      };

      useEffect(() => () => {
        if (holdTimer.current) clearInterval(holdTimer.current);
      }, []);

      return (
        <div className="w-full">
          <div className="flex items-center justify-between mb-2">
            <span className="mono text-[7px] tracking-[0.26em] text-[#00E5FF]/70">
              GATE 01 // CONJUGATE BEAM
            </span>
            <span className="mono text-[7px] tracking-[0.22em] text-[#E8E6E1]/30">
              {applied ? "CONJUGATE APPLIED" : armed ? "HOLD TO CHARGE" : "LOCKED"}
            </span>
          </div>

          <div
            ref={trackRef}
            onMouseDown={handleDown}
            onMouseUp={handleUp}
            onMouseLeave={handleUp}
            onTouchStart={handleDown}
            onTouchEnd={handleUp}
            className="relative h-24 w-full border border-[#E8E6E1]/15 bg-[#07090E] overflow-hidden select-none"
            style={{ cursor: armed && !applied ? "pointer" : "not-allowed", touchAction: "none" }}
          >
            {/* The radical core the beam must sweep through */}
            <div
              className="absolute top-1/2 rounded-full border"
              style={{
                left: `${MID}%`,
                width: "18%",
                aspectRatio: "1 / 1",
                transform: "translate(-50%, -50%)",
                borderColor: applied ? "#FFC857" : "rgba(0,229,255,0.55)",
                background: "#07090E",
                boxShadow: applied
                  ? "0 0 20px rgba(255,200,87,0.75)"
                  : "0 0 14px rgba(0,229,255,0.45)",
                animation: applied ? "none" : "mf-hole-breathe 2.4s ease-in-out infinite"
              }}
            >
              <span
                className="absolute inset-0 flex items-center justify-center"
                style={{ fontFamily: "monospace", fontSize: "13px", color: applied ? "#FFC857" : "#00E5FF" }}
              >
                √
              </span>
            </div>

            {/* Full-strength conjugate beam */}
            <div
              className="absolute top-0 bottom-0"
              style={{
                left: `${x}%`,
                width: 3,
                transform: "translateX(-1.5px)",
                background: applied ? "#FFC857" : "#00E5FF",
                boxShadow: applied
                  ? "0 0 18px rgba(255,200,87,0.95)"
                  : "0 0 14px rgba(0,229,255,0.95)",
                animation: applied ? "none" : "mf-cut-armed 1.4s ease-in-out infinite"
              }}
            />

            {[0, 1, 2, 3, 4].map((n) => (
              <div
                key={`cb-tick-${n}`}
                className="absolute bottom-0 w-px bg-[#E8E6E1]/20"
                style={{ left: `${n * 25}%`, height: 6 }}
              />
            ))}
          </div>

          <div className="mono mt-1.5 text-[6.5px] tracking-[0.16em] text-[#E8E6E1]/30">
            {applied
              ? "DIFFERENCE OF SQUARES FORCED — RADICAL CLEARED"
              : "HOLD THE CORE — THE BEAM DRIVES THROUGH"}
          </div>
        </div>
      );
    }

    function MindForgeScreen({ onExitToRoadmap, onShowToast }) {
      // Internal Fault 01 Stages:
      // 'airlock' -> 'deck_fracture' -> 'blade_slice' -> 'primary_weld' -> 'aftershock_surge' -> 'fault_complete'
      const [stage, setStage] = useState('airlock');
      const [seedIdx, setSeedIdx] = useState(0);

      // Which trial is live. Fault 01 = polynomial removable singularity;
      // Fault 02 = radical conjugate laser.
      const [trial, setTrial] = useState(1);

      // Fault 02 state — conjugate beam gate + precision tumbler.
      const [conjugateApplied, setConjugateApplied] = useState(false);
      const conjProgress = useRef(0);

      // Fault 02 seed catalog. b/c drive the conjugate (√(x + b) + c); the
      // deck height is always the limit 1 / (2c) written to four decimals.
      const RADICAL_SEEDS = [
        {
          id: "rad_alpha",
          targetX: 2,
          b: 7,
          c: 3,
          shardSeed: 61,
          fractureOffset: -0.3,
          formula: "(√(x + 7) - 3) / (x - 2)",
          conjugate: "(√(x + 7) + 3)",
          numeratorAfter: "(x + 7) - 9",

        },
        {

        },

        }

      const activeRadical = RADICAL_SEEDS[seedIdx % RADICAL_SEEDS.length];

      // Seed Catalog
      const SEEDS = [
        {
          id: "alpha",
          targetX: 2,
          shardSeed: 11,
          fractureOffset: -0.4,
          formula: "(x² - 4) / (x - 2)",

        },
        {

          targetX: 3,
          shardSeed: 27,
          fractureOffset: 0.25,
          formula: "(x² - x - 6) / (x - 3)",
          factored: "(x - 3)(x + 2) / (x - 3)",
          simplified: "y = x + 2",
          primaryAnswer: "5.0000",
          aftershockFormula: "y = 3x - 2",
          aftershockAnswer: "7.0000"
        },
        {
          id: "gamma",
          targetX: 4,
          shardSeed: 43,
          fractureOffset: 0.55,
          formula: "(x² - 16) / (x - 4)",
          factored: "(x - 4)(x + 4) / (x - 4)",
          simplified: "y = x + 4",
          primaryAnswer: "8.0000",
          aftershockFormula: "y = 2x - 3",
          aftershockAnswer: "5.0000"
        }
      ];
      const activeSeed = SEEDS[seedIdx % SEEDS.length];

      // Canvas geometry: the singularity sits off the deck mid-axis per seed.
      const fractureX = 500 + activeSeed.fractureOffset * 120;

      /* ANTI-GUESSWORK · the four root candidates are shuffled per seed so the
         correct root is never parked in a fixed slot. The order is derived from
         the seed index, so it is stable for a given seed but different across
         seeds and across re-seeds. */
      const rootOptions = useMemo(() => {
        const options = [
          "(x - " + activeSeed.targetX + ")",
          "(x + " + activeSeed.targetX + ")",
          "(x - 1)",
          "(x + 1)"
        ];
        // Deterministic Fisher–Yates seeded by the seed variant.
        let state = (seedIdx + 1) * 2654435761 % 2147483647;
        const rand = () => {
          state = (state * 48271) % 2147483647;
          return state / 2147483647;
        };
        for (let i = options.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = options[i];
          options[i] = options[j];
          options[j] = tmp;
        }
        return options;
      }, [seedIdx, activeSeed.targetX]);

      // Fault 01 gate state — nothing is handed over for free.
      const [rootPicked, setRootPicked] = useState(null);
      const [severed, setSevered] = useState(false);
      const [welded, setWelded] = useState(false);
      const cutProgress = useRef(0);

      // Physical Structural State
      const [shearStress, setShearStress] = useState(0.48);
      const [tumblerInput, setTumblerInput] = useState("");
      const [freefallClock, setFreefallClock] = useState(0.00);
      const [strikeCount, setStrikeCount] = useState(0);
      const [aftershockTimer, setAftershockTimer] = useState(15);
      const [archivistLock, setArchivistLock] = useState(false);

      // Cognitive Dialogue Transmission
      const [dialogue, setDialogue] = useState({
        speaker: "SAGE",
        text: "The skybridge deck is flexing under load. Verify boundary coordinates at the airlock."
      });

      // Freefall Dilation Timer
      useEffect(() => {
        const interval = setInterval(() => {
          setFreefallClock(t => +(t + 0.01).toFixed(2));
        }, 100);
        return () => clearInterval(interval);
      }, []);

      // Aftershock Countdown Timer
      useEffect(() => {
        let t;
        if (stage === 'aftershock_surge' && aftershockTimer > 0) {
          t = setInterval(() => {
            setAftershockTimer(prev => {
              if (prev <= 1) {
                handleFailure("AFTERSHOCK BREACH: Girder sheared before secondary pin locked. Node collapsed.");
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(t);
      }, [stage, aftershockTimer]);

      // Error and Strike Handling
      const handleFailure = (customMsg) => {
        const next = strikeCount + 1;
        setStrikeCount(next);
        audio.playAlarm();
        setShearStress(s => Math.min(1.0, +(s + 0.18).toFixed(2)));
        setTumblerInput("");

                            setWelded(true);
                            setShearStress(0.85); // STRESS SURGE!

                  )}

                  {/* GATE 02 · PRECISION TUMBLER · 1 / (2c) */}
                  {stage === 'radical_crunch' && (
                    <div className="bg-[#0A0C14] border border-[#FFC857]/40 p-6 shadow-xl text-center">
                      <div className="mono text-[7.5px] tracking-[0.2em] text-[#FFC857] mb-1">
                        CONJUGATE APPLIED // PRECISION TUMBLER
                      </div>
                      <div className="serif text-[18px] text-[#E8E6E1] mb-1">{activeRadical.simplified}</div>
                      <p className="mono text-[7.5px] text-[#E8E6E1]/60 mb-4">
                        Crunch 1 / (2 × {activeRadical.c}) on paper. Dial the four-decimal limit height:
                      </p>

                      <div className="w-full h-11 border border-[#FFC857] bg-[#07090E] flex items-center justify-between px-4 mb-3">
                        <span className="text-[7.5px] text-[#FFC857]/40 tracking-[0.2em]">LIMIT HEIGHT:</span>
                        <span className="text-[17px] font-bold text-[#FFC857] tracking-[0.18em]">
                          {tumblerInput || "—.————"}
                        </span>
                      </div>

                      <div className="grid grid-cols-4 gap-1.5 w-full">
                        {["7", "8", "9", "CLR", "4", "5", "6", ".", "1", "2", "3", "0"].map((k) => (
                          <button
                            key={`rad-${k}`}
                            onClick={() => {
                              audio.playClick();
                              if (k === "CLR") {
                                setTumblerInput("");
                                return;
                              }
                              setTumblerInput((prev) => {
                                if (k === "." && prev.includes(".")) return prev;
                                const parts = prev.split(".");
                                if (parts[1] && parts[1].length >= 4) return prev;
                                return prev + k;
                              });
                            }}
                            className={`h-9 border mono text-[11px] tracking-[0.06em] transition-colors ${
                              k === "CLR" || k === "."
                                ? "border-[#FFC857]/40 text-[#FFC857] hover:bg-[#FFC857]/10"
                                : "border-[#E8E6E1]/20 bg-[#07090E] text-[#E8E6E1] hover:border-[#FFC857]"
                            }`}
                          >
                            {k}
                          </button>
                        ))}
                      </div>

                      <button
                        onClick={() => {
                          const parsed = Number.parseFloat(tumblerInput);
                          if (Number.isFinite(parsed) && Math.abs(parsed - activeRadical.answer) < 0.00005) {
                            audio.playFuse();
                            setShearStress(0.08);
                            setStage('radical_complete');
                            setDialogue({
                              speaker: "SAGE",
                              text: "Correct to four decimals. The conjugate laser did in one stroke what factoring never could. Fault 02 is fused."
                            });
                            if (onShowToast) onShowToast("Fault 02 fused at " + activeRadical.answer.toFixed(4) + ".");
                          } else {
                            handleFailure(
                              "Precision failure. The limit is 1 / (2 × " + activeRadical.c + ") — one divided by " + (2 * activeRadical.c) + "."
                            );
                          }
                        }}
                        className="mt-3 w-full py-2.5 border border-[#FFC857] bg-[#FFC857]/15 mono text-[8.5px] tracking-[0.2em] text-[#FFC857] font-bold hover:bg-[#FFC857]/30 transition-all"
                      >
                        LOCK CONJUGATE READOUT
                      </button>
                    </div>
                  )}

                  {/* FAULT 02 NEUTRALIZED */}
                  {stage === 'radical_complete' && (
                    <div className="bg-[#0A0C14] border border-[#FFC857] p-8 text-left shadow-[0_0_50px_rgba(255,200,87,0.15)]">
                      <div className="mono text-[8px] text-[#FFC857] tracking-[0.24em]">
                        FAULT 02 NEUTRALIZED
                      </div>
                      <div className="mt-3 border-t border-[#FFC857]/20 pt-3 mono text-[8px] text-[#E8E6E1]/60 tracking-[0.18em] leading-loose">
                        RADICAL CLEARED<br />
                        CONJUGATE FUSED<br />
                        <span className="text-[#00E5FF]">SPAN CARRYING LOAD // F3 BERTH OPEN</span>
                      </div>
                      <p className="mono text-[7.5px] text-[#E8E6E1]/50 mt-4 leading-relaxed">
                        The radical singularity at x = {activeRadical.targetX} reads {activeRadical.answer.toFixed(4)}.
                        Crosswinds are settling on the downstream span.
                      </p>
                      <button
                        onClick={() => {
                          if (onShowToast) onShowToast("Fault 02 complete. Returning to the Roadmap.");
                          setTimeout(() => onExitToRoadmap(), 1200);
                        }}
                        className="mt-6 border border-[#FFC857] bg-[#FFC857]/15 py-3 px-6 mono text-[9px] tracking-[0.22em] text-[#FFC857] font-bold hover:bg-[#FFC857]/30 transition-all w-full"
                      >
                        RETURN TO ROADMAP →
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* SAGE COGNITIVE TRANSMITTER (BOTTOM CENTER) */}
          <footer className="relative z-20 w-full max-w-xl mx-auto px-4 pb-4">
            <div className={`p-3.5 border backdrop-blur-md shadow-2xl transition-all ${
              dialogue.speaker === 'ARCHIVIST' 
                ? 'bg-[#150F14] border-red-500/80 text-red-200' 
                : 'bg-[#0A0C14]/90 border-[#00E5FF]/30 text-[#E8E6E1]'
            }`}>
              <div className="flex items-center justify-between border-b border-current/20 pb-1 mb-1.5">
                <span className="mono text-[7px] tracking-[0.24em] font-medium text-[#00E5FF]">
                  {dialogue.speaker === 'ARCHIVIST' ? 'ARCHIVIST // RESTRICTED TAKEOVER' : 'SAGE // NEURAL TRANSMISSION'}
                </span>
                <span className="mono text-[6.5px] tracking-[0.14em] opacity-40">
                  {dialogue.speaker === 'ARCHIVIST' ? 'STRIKE 3' : 'LIVE'}
                </span>
              </div>
              <div className="serif italic text-[12px] md:text-[13px] leading-snug">
                "{dialogue.text}"
              </div>
            </div>
          </footer>

          {/* ARCHIVIST 3-STRIKE LOCKOUT OVERLAY */}
          {archivistLock && (
            <div className="fixed inset-0 z-50 bg-[#07090E]/95 backdrop-blur-md flex items-center justify-center p-6">
              <div className="border border-red-500 bg-[#0A0C14] p-8 max-w-sm w-full text-center shadow-2xl">
                <div className="mono text-[7.5px] tracking-[0.28em] text-red-400 mb-2">ARCHIVE CODEX // PENALTY AUDIT</div>
                <h3 className="serif text-[18px] text-[#E8E6E1] mb-3">DO NOT GUESS AGAIN.</h3>
                <div className="border border-[#E8E6E1]/15 bg-[#07090E] p-4 text-left mono text-[8px] text-[#00E5FF] space-y-1.5">
                  <div>1. CANCEL: (x - a) root must be completely severed.</div>
                  <div>2. REMAINDER: Evaluate linear remainder y = x + a.</div>
                  <div>3. AFTERSHOCK: Downstream load shifts to secondary girder.</div>
                </div>
                <div className="mono text-[7px] text-[#E8E6E1]/40 mt-4">SEED MUTATED // RESUMING IN 4s...</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Boundary note: React.memo is resolved off React (no destructuring above),
    // so the Atelier is pinned against <CitadelEngine>'s re-renders. That keeps
    // the intro <video> mounted — and playing — while a toast fades out.
    const AtelierNode = React.memo(AtelierScreen);

    // =======================================================================
    // MASTER CONTROLLER: CITADEL ENGINE
    // =======================================================================
    function CitadelEngine() {
      const [currentScreen, setCurrentScreen] = useState('gates');
      const [showIntro, setShowIntro] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      // Mirrors the Atelier's "Ambient Acoustics" switch so the intro knows
      // whether the apprentice asked for silence.
      const [soundMuted, setSoundMuted] = useState(false);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const handleEnrolSuccess = () => {
        setCurrentScreen('atelier');
        setShowIntro(true); // Triggers real 34s R2 Video Modal
      };

      // Stable callbacks: <AtelierNode> is memoised, so new identities here
      // would re-render it (and remount the video) on every toast tick.
      const openRoadmap = useCallback(() => setCurrentScreen('roadmap'), []);
      const logout = useCallback(() => setCurrentScreen('gates'), []);
      const replayIntro = useCallback(() => setShowIntro(true), []);
      const dismissIntro = useCallback(() => setShowIntro(false), []);

      return (
        <div className="relative w-full min-h-screen bg-[#07090E]">
          {currentScreen === 'gates' && (
            <GatesScreen
              onEnterForge={() => setCurrentScreen('enrolment')}
              onShowToast={triggerToast}
            />
          )}

          {currentScreen === 'enrolment' && (
            <EnrolmentScreen
              onBackToGates={() => setCurrentScreen('gates')}
              onSuccess={handleEnrolSuccess}
              onShowToast={triggerToast}
            />
          )}

          {currentScreen === 'atelier' && (
            <AtelierNode
              onOpenRoadmap={openRoadmap}
              onLogout={logout}
              onReplayIntro={replayIntro}
              onSoundMutedChange={setSoundMuted}
            />
          )}

          {currentScreen === 'roadmap' && (
            <RoadmapScreen
              onBackToAtelier={() => setCurrentScreen('atelier')}
              onEnterMindForge={() => setCurrentScreen('mindforge')}
            />
          )}

          {currentScreen === 'mindforge' && (
            <MindForgeScreen
              onExitToRoadmap={() => setCurrentScreen('roadmap')}
              onShowToast={triggerToast}
            />
          )}

          {/* Toast Container */}
          {toastMessage && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
              <div className="border border-[#FFC857]/40 bg-[#07090E]/95 px-5 py-2.5 shadow-2xl backdrop-blur-md flex items-center gap-2.5">
                <span className="w-1.5 h-1.5 rounded-full bg-[#FFC857] animate-pulse" />
                <span className="mono text-[8.5px] tracking-[0.16em] text-[#E8E6E1]">{toastMessage}</span>
              </div>
            </div>
          )}

          {/* 34s Universal Intro Modal (R2 Stream Player Slot).
              allowAudio: the intro is only silent when the Atelier's
              "Ambient Acoustics" is explicitly set to MUTED. */}
          {showIntro && (
            <div className="fixed inset-0 z-[100] bg-black flex items-center justify-center p-0 md:p-6">
              <div className="relative w-full h-full md:h-auto md:max-w-[420px] md:aspect-[9/16] bg-black flex flex-col justify-between border-0 md:border md:border-[#E8E6E1]/20 overflow-hidden">
                <VideoPlayer
                  src={R2_INTRO_URL}
                  allowAudio={currentScreen !== 'atelier' || !soundMuted}
                  onEnded={dismissIntro}
                  onSkip={dismissIntro}
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CitadelEngine />);

    // -----------------------------------------------------------------------
    // ONLINE DIAGNOSTIC (console only): `await __forgeAudioReport()` tells you
    // whether the R2 master really carries an audio track. On Windows the
    // byte-range read works too, so the result is decisive for this file.
    // -----------------------------------------------------------------------
    window.__forgeAudioReport = async function (url) {
      const src = url || R2_INTRO_URL;
      const report = { src, canPlayTypeMp4Aac: "", webkitAudioDecodedByteCount: 0, rangeScan: "n/a" };
      const node = document.createElement("video");
      node.muted = true;
      node.preload = "auto";
      report.canPlayTypeMp4Aac = node.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"') || "(none)";

      if (/safari/i.test(navigator.userAgent) && !/chrome|chromium|edg/i.test(navigator.userAgent)) {
        // WebKit: decode a tiny slice and read the audio byte counter.
        node.src = src;
        await new Promise((resolve) => {
          const done = () => resolve();
          node.addEventListener("loadeddata", done, { once: true });
          node.addEventListener("error", done, { once: true });
          setTimeout(done, 6000);
        });
        report.webkitAudioDecodedByteCount = node.webkitAudioDecodedByteCount;
      } else {
        // MP4 layout: the `moov` box holds one `trak` per stream, and an audio
        // trak always contains an `smhd` (sound media header) and `mp4a`.
        try {
          const res = await fetch(src);
          const buffer = new Uint8Array(await res.arrayBuffer());
          const text = new TextDecoder("latin1").decode(buffer);
          const traks = (text.match(/trak/g) || []).length;
          const handlerTypes = (text.match(/(vide|soun)/g) || []);
          report.rangeScan = {
            bytes: buffer.length,
            traks,
            handlerTypes,
            hasSmhd: text.includes("smhd"),
            hasMp4a: text.includes("mp4a"),
            hasEsds: text.includes("esds"),
            hasSounHandler: text.includes("soun"),
            verdict: text.includes("smhd") && text.includes("mp4a")
              ? "AUDIO TRACK PRESENT"
              : "NO AUDIO TRACK — re-encode the master with -c:a aac"
          };
        } catch (err) {
          report.rangeScan = "fetch failed: " + err.message;
        }
      }
      console.table(report);
      return report;
    };
  </script>
</body>
